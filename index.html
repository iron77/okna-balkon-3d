<title>Okna balkonowe 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Układ: scena 3D na cały ekran; sterowanie w tabliczce jak na arkuszu rysunku, w lewym górnym rogu; nazwa części u dołu */
:root {
  --scene: #e3e7eb; --panel: #f9fafb; --ink: #1b232b; --muted: #5a6672; --line: #c8d0d7; --accent: #1f5f80; --accent-ink: #ffffff;
  --edge: #2a2f35;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif; --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --scene: #191d22; --panel: #22282f; --ink: #e4e9ee; --muted: #98a5b1; --line: #3a444e; --accent: #73b9da; --accent-ink: #0d1a21;
  --edge: #0b0d10; color-scheme: dark } }
:root[data-theme="dark"] {
  --scene: #191d22; --panel: #22282f; --ink: #e4e9ee; --muted: #98a5b1; --line: #3a444e; --accent: #73b9da; --accent-ink: #0d1a21;
  --edge: #0b0d10; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--scene); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#scena { position: fixed; inset: 0; }
#scena canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.tab { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(318px, calc(100% - 32px)); max-height: calc(100% - 96px); overflow: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.08); }
.tab summary { list-style: none; cursor: pointer; padding: 10px 12px 9px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  border-bottom: 1px solid var(--line); }
.tab summary::-webkit-details-marker { display: none; }
.tab summary h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.tab summary span { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.tab[open] summary span::after { content: "zwiń"; } .tab:not([open]) summary span::after { content: "rozwiń"; }
.tresc { display: grid; gap: 14px; padding: 12px; }
.tresc p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.etk { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.widoki { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.widoki button { font: inherit; font-size: 14px; padding: 6px 8px; text-align: left; border: 1px solid var(--line); border-radius: 3px;
  background: transparent; color: var(--ink); cursor: pointer; }
.widoki button:hover { border-color: var(--accent); }
.widoki button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.widoki button:focus-visible, .tab summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pokaz { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.pokaz label { display: flex; align-items: center; gap: 6px; font-size: 14.5px; cursor: pointer; }
.pokaz input { accent-color: var(--accent); }
.suwak { display: grid; gap: 3px; }
.suwak .gora { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.suwak output { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); text-align: right; min-width: 0; }
.suwak input { width: 100%; accent-color: var(--accent); margin: 0; }
.nazwa { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 11px;
  font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.nazwa b { font-family: var(--f-num); font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.zip { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.zip label { display: flex; align-items: center; gap: 6px; font-size: 14.5px; cursor: pointer; }
.zip input { accent-color: var(--accent); }
.akcja { font: inherit; font-size: 14.5px; padding: 7px 10px; border: 1px solid var(--accent); border-radius: 3px; width: 100%;
  background: transparent; color: var(--ink); cursor: pointer; text-align: center; }
.akcja:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.akcja[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.akcja:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.blad { position: fixed; inset: auto 16px 50% 16px; text-align: center; color: var(--muted); font-size: 15px; }
@media (max-width: 600px) { .tab { max-height: calc(100% - 110px); } .widoki button { font-size: 13.5px; } }
</style>

  <div class="tresc">
    <div>
      <div class="etk">Widok</div>
      <div class="widoki" id="widoki">
        <button type="button" id="w-zewnatrz" data-w="zewnatrz">Z balkonu</button>
        <button type="button" id="w-pokoj" data-w="pokoj">Z pokoju</button>

        <button type="button" id="w-rzut" data-w="rzut">Rzut z góry</button>
        <button type="button" id="w-dol-duzego" data-w="dol-duzego">Dół okna większego</button>
        <button type="button" id="w-dol-skrzyni" data-w="dol-skrzyni">Dół okna w skrzyni</button>

      </div>

    <div>
      <div class="etk">Pokaż</div>
      <div class="pokaz">
        <label><input type="checkbox" id="g-budynek" checked> Budynek</label>
        <label><input type="checkbox" id="g-skrzynia" checked> Skrzynia</label>
        <label><input type="checkbox" id="g-szyby" checked> Szyby</label>
        <label><input type="checkbox" id="g-daszek" checked> Daszek</label>
        <label><input type="checkbox" id="g-dszyba"> Szyba daszka</label>
      </div>
    </div>
    <div>
      <div class="etk">Okna</div>

    </div>
    <div>
      <div class="etk">Roleta ZIP</div>
      <div class="zip" role="radiogroup" aria-label="Roleta ZIP">
        <label><input type="radio" name="zip" id="zip-brak" value="brak" checked> brak</label>
        <label><input type="radio" name="zip" id="zip-0" value="0"> w licu ramy</label>
        <label><input type="radio" name="zip" id="zip-10" value="10"> offset 10 mm</label>
        <label><input type="radio" name="zip" id="zip-20" value="20"> offset 20 mm</label>
      </div>
    </div>
    <div class="suwak" id="zip-s" hidden>
      <div class="gora"><label for="opu">Opuszczenie rolety</label><output id="opu-o" for="opu"></output></div>
      <input type="range" id="opu" min="0" max="100" step="1" value="100">
    </div>
    <div>
      <div class="etk">Moskitiera NEHER</div>
      <div class="zip" role="radiogroup" aria-label="Moskitiera NEHER" id="mosk-w">
        <label><input type="radio" name="mosk" value="brak" checked> brak</label>
      </div>
    </div>
    <div class="suwak">
      <div class="gora"><label for="cx">Cięcie pionowe</label><output id="cx-o" for="cx"></output></div>
      <input type="range" id="cx" min="0" max="1000" step="1" value="1000">
    </div>
    <div class="suwak">
      <div class="gora"><label for="cy">Cięcie poziome</label><output id="cy-o" for="cy"></output></div>
      <input type="range" id="cy" min="0" max="1000" step="1" value="1000">
    </div>
    <p>Obrót – przeciągnij, przesuw – prawy przycisk, zbliżenie – kółko.</p>
  </div>
</details>

  for (const [gr, L] of Object.entries(D.mosk.sruby || {})) for (const [x, y, z] of L) {
    for (const [g, m_] of [[gL, mF.zaczep], [gT, mF.zaczep], [gK[0], mF.uszczelka_siatki], [gK[1], mF.uszczelka_siatki]]) {

}
// moskitiery NEHER: model z doboru NEHER, na obu oknach tam, gdzie pasuje przy wybranym położeniu rolety

const naX = u => Math.round((-u / 1000 - D.xMin) / (D.xMax - D.xMin) * 1000), naY = h => Math.round((D.yBal + h / 1000 - D.yMin) / (D.yMax - D.yMin) * 1000);
const WIDOKI = {

  "rzut": { p: [-0.12, 2.6, 1.1], t: [-0.12, -1.3, 0.12], cx: 1000, cy: naY(1300) },
  "dol-duzego": { p: [0.15, -2.05, 0.95], t: [-0.5, -2.47, 0.02], cx: naX(500), cy: 1000 },
  "dol-skrzyni": { p: [1.05, -2.0, 0.95], t: [0.4, -2.4, 0.02], cx: naX(-400), cy: 1000 },
  "gora-duzego": { p: [0.15, 0.3, 1.0], t: [-0.5, -0.06, 0.03], cx: naX(500), cy: 1000 },

let lot = null;
function ustaw(n, plynnie) {
  const w = WIDOKI[n] || WIDOKI.zewnatrz; cx.value = w.cx; cy.value = w.cy; ciecia();

  const p1 = new THREE.Vector3(...w.p), t1 = new THREE.Vector3(...w.t);

}
for (const b of document.querySelectorAll("#widoki button")) b.addEventListener("click", () => {
  if (location.hash === "#" + b.dataset.w) ustaw(b.dataset.w, true); else location.hash = b.dataset.w; });
addEventListener("hashchange", () => ustaw(location.hash.slice(1), true));

// nazwa części pod kursorem / po kliknięciu (z pominięciem tego, co odcięte)
const ray = new THREE.Raycaster(), mysz = new THREE.Vector2(), nazwaT = document.getElementById("nazwa-t");
function trafienie(x, y) {
  const rc = r.domElement.getBoundingClientRect(); mysz.set((x - rc.left) / rc.width * 2 - 1, -(y - rc.top) / rc.height * 2 + 1);
  ray.setFromCamera(mysz, kam);
  const widac = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  for (const h of ray.intersectObjects(cele.filter(widac), false))

  return null;
}
let ruch = null, wcisk = null;
r.domElement.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { ruch = [e.clientX, e.clientY]; } });

r.domElement.addEventListener("pointerup", e => {
  ruch = [e.clientX, e.clientY];
  if (wcisk && Math.hypot(e.clientX - wcisk[0], e.clientY - wcisk[1]) < 6) {             // klik (bez obracania) w klamkę
    const o = trafienie(e.clientX, e.clientY), s = o && o.userData.okno;

  }

});

const tab = document.getElementById("tab");
function rozmiar() {
  const w = host.clientWidth, h = host.clientHeight; r.setSize(w, h, false);
  const d = tab.open && w > 760 ? Math.round((tab.getBoundingClientRect().right + 8) / 2) : 0;   // obok panelu
  kam.aspect = (w + 2 * d) / h; if (d) kam.setViewOffset(w + 2 * d, h, 0, 0, w, h); else kam.clearViewOffset();
  kam.updateProjectionMatrix(); odswiez();
}
new ResizeObserver(rozmiar).observe(host); tab.addEventListener("toggle", rozmiar); rozmiar();
ster.addEventListener("change", odswiez);
// zbliżenie kółkiem / touchpadem (user 5.11: na touchpadzie ThinkPada za wolno): własne zamiast OrbitControls – krok zależy
// od wielkości ruchu (touchpad daje wiele małych zdarzeń, kółko myszy ok. 100 na ząbek; szczypanie – ctrlKey, małe wartości),
// w stronę punktu pod kursorem (na płaszczyźnie celu)
const _p = new THREE.Plane(), _r = new THREE.Raycaster(), _v = new THREE.Vector2(), _P = new THREE.Vector3(), _n = new THREE.Vector3();

const _hit = new THREE.Raycaster();
function punktPod(x, y) {

}
// punkt obrotu na głębokość oglądanej powierzchni (wzdłuż osi widoku – obraz nie skacze): obrót, przesuw i zoom w jej skali
function celNaGlebokosc(P) {

// zbliżenie kółkiem / touchpadem (user 5.11: na touchpadzie za wolno, zoom stawał, przesuw przy zbliżeniu ciężki): w stronę
// powierzchni pod kursorem, aż do 3 mm od niej; krok wg wielkości ruchu (szczypanie – ctrlKey); punkt pod kursorem liczony raz na gest
let _kol = { t: 0, x: 0, y: 0, P: null };
host.addEventListener("wheel", e => {
  e.preventDefault(); e.stopPropagation();

  const f = Math.exp(Math.max(-0.6, Math.min(0.6, d * (e.ctrlKey ? 0.012 : 0.0022))));
  const teraz = performance.now();
  if (teraz - _kol.t > 250 || Math.hypot(e.clientX - _kol.x, e.clientY - _kol.y) > 4 || !_kol.P) {
    let P = punktPod(e.clientX, e.clientY);
    if (!P) { _r.setFromCamera(_v, kam); kam.getWorldDirection(_n); _p.setFromNormalAndCoplanarPoint(_n, ster.target);
      P = _r.ray.intersectPlane(_p, new THREE.Vector3()) || ster.target.clone(); }
    else { P = P.clone(); celNaGlebokosc(P); }
    _kol.P = P;
  }

  const P = _kol.P, odl = kam.position.distanceTo(P), k = Math.min(Math.max(odl * f, 0.003), 30) / odl;
  kam.position.sub(P).multiplyScalar(k).add(P); ster.target.sub(P).multiplyScalar(k).add(P);
  lot = null; ster.update(); odswiez();
}, { capture: true, passive: false });
// przesuw (prawy przycisk / dwa palce) i obrót: punkt obrotu na głębokość tego, co pod kursorem – przesuw w skali oglądanej rzeczy
host.addEventListener("pointerdown", e => { const P = punktPod(e.clientX, e.clientY); if (P) celNaGlebokosc(P); }, { capture: true });
roleta(); wariant(); moskitiera();
ustaw(location.hash.slice(1) || "zewnatrz", false);
if (location.search.includes("otwarte")) { for (const s of Object.keys(OTW)) { OTW[s].t = OTW[s].cel = 1; okno(s); } przycisk(); }
if (location.search.includes("uchylone")) { for (const s of Object.keys(OTW)) { OTW[s].tryb = "u"; OTW[s].t = OTW[s].cel = 1; okno(s); } przycisk(); }
{ const m = location.search.match(/mosk=([^&]+)/); if (m) { const i = document.querySelector(`input[name="mosk"][value="${decodeURIComponent(m[1])}"]`); if (i) { i.checked = true; moskitiera(); } } }
{ const m = location.search.match(/zip=([^&]+)/); if (m) { const i = document.getElementById("zip-" + m[1]); if (i) { i.checked = true; wariant(); moskitiera(); } } }

(function petla(t) {
  requestAnimationFrame(petla);
  if (lot) { const k = Math.min(1, (performance.now() - lot.s) / 700), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    kam.position.lerpVectors(lot.p0, lot.p1, e); ster.target.lerpVectors(lot.t0, lot.t1, e); if (k >= 1) lot = null; brudne = true; }
  for (const [s, st] of Object.entries(OTW)) if (st.an) {
    const k = Math.min(1, (performance.now() - st.an.s) / (st.tryb === "u" ? 1500 : 1800)); st.t = st.an.od + (st.cel - st.an.od) * k; okno(s);
    if (k >= 1) { st.an = null; if (st.nast) { const n = st.nast; st.nast = null; ustawOkno(s, 1, n); } } }
  if (ster.update()) brudne = true;
  if (ruch) { const o = trafienie(...ruch); nazwaT.textContent = o ? o.userData.nazwa : "najedź na element";
    r.domElement.style.cursor = o && o.userData.okno ? "pointer" : ""; ruch = null; }
  if (brudne) { wlosy(); const o_ = kam.position.distanceTo(ster.target), nr = Math.min(0.03, Math.max(0.0003, o_ * 0.02));
    const fr = Math.max(12, o_ + 12);                      // dalsza płaszczyzna też wg odległości (6.11: po oddaleniu model znikał)
    if (Math.abs(kam.near - nr) > 1e-6 || Math.abs(kam.far - fr) > 1e-3) { kam.near = nr; kam.far = fr; kam.updateProjectionMatrix(); }
    r.render(scena, kam); brudne = false;
    if (!window.__okna3dGotowe) { window.__okna3dGotowe = true; document.getElementById("blad").hidden = true; } }
})();
