<title>Okna balkonowe 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Układ: scena 3D na cały ekran; sterowanie w tabliczce jak na arkuszu rysunku, w lewym górnym rogu; nazwa części u dołu */
:root {
  --scene: #e3e7eb; --panel: #f9fafb; --ink: #1b232b; --muted: #5a6672; --line: #c8d0d7; --accent: #1f5f80; --accent-ink: #ffffff;
  --edge: #2a2f35;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif; --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --scene: #191d22; --panel: #22282f; --ink: #e4e9ee; --muted: #98a5b1; --line: #3a444e; --accent: #73b9da; --accent-ink: #0d1a21;
  --edge: #0b0d10; color-scheme: dark } }
:root[data-theme="dark"] {
  --scene: #191d22; --panel: #22282f; --ink: #e4e9ee; --muted: #98a5b1; --line: #3a444e; --accent: #73b9da; --accent-ink: #0d1a21;
  --edge: #0b0d10; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--scene); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#scena { position: fixed; inset: 0; }
#scena canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.tab { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(318px, calc(100% - 32px)); max-height: calc(100% - 96px); overflow: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.08); }
.tab summary { list-style: none; cursor: pointer; padding: 10px 12px 9px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  border-bottom: 1px solid var(--line); }
.tab summary::-webkit-details-marker { display: none; }
.tab summary h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.tab summary span { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.tab[open] summary span::after { content: "zwiń"; } .tab:not([open]) summary span::after { content: "rozwiń"; }
.tresc { display: grid; gap: 14px; padding: 12px; }
.tresc p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.etk { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.widoki { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.widoki button { font: inherit; font-size: 14px; padding: 6px 8px; text-align: left; border: 1px solid var(--line); border-radius: 3px;
  background: transparent; color: var(--ink); cursor: pointer; }
.widoki button:hover { border-color: var(--accent); }
.widoki button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.widoki button:focus-visible, .tab summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pokaz { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.pokaz label { display: flex; align-items: center; gap: 6px; font-size: 14.5px; cursor: pointer; }
.pokaz input { accent-color: var(--accent); }
.suwak { display: grid; gap: 3px; }
.suwak .gora { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.suwak output { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); text-align: right; min-width: 0; }
.suwak input { width: 100%; accent-color: var(--accent); margin: 0; }
.nazwa { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 11px;
  font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.nazwa b { font-family: var(--f-num); font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.zip { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.zip label { display: flex; align-items: center; gap: 6px; font-size: 14.5px; cursor: pointer; }
.zip input { accent-color: var(--accent); }
.akcja { font: inherit; font-size: 14.5px; padding: 7px 10px; border: 1px solid var(--accent); border-radius: 3px; width: 100%;
  background: transparent; color: var(--ink); cursor: pointer; text-align: center; }
.akcja:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.akcja[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.akcja:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.blad { position: fixed; inset: auto 16px 50% 16px; text-align: center; color: var(--muted); font-size: 15px; }
@media (max-width: 600px) { .tab { max-height: calc(100% - 110px); } .widoki button { font-size: 13.5px; } }
</style>

  <div class="tresc">
    <div>
      <div class="etk">Widok</div>
      <div class="widoki" id="widoki">
        <button type="button" id="w-zewnatrz" data-w="zewnatrz">Z balkonu</button>
        <button type="button" id="w-pokoj" data-w="pokoj">Z pokoju</button>

        <button type="button" id="w-przekroj-skrzynia" data-w="przekroj-skrzynia">Przekrój: okno w skrzyni</button>
        <button type="button" id="w-rzut" data-w="rzut">Rzut z góry</button>
        <button type="button" id="w-dol-duzego" data-w="dol-duzego">Dół okna większego</button>
        <button type="button" id="w-dol-skrzyni" data-w="dol-skrzyni">Dół okna w skrzyni</button>
        <button type="button" id="w-gora-duzego" data-w="gora-duzego">Góra okna większego</button>
        <button type="button" id="w-daszek" data-w="daszek">Daszek z góry</button>
      </div>

    <div>
      <div class="etk">Pokaż</div>
      <div class="pokaz">
        <label><input type="checkbox" id="g-budynek" checked> Budynek</label>
        <label><input type="checkbox" id="g-skrzynia" checked> Skrzynia</label>
        <label><input type="checkbox" id="g-szyby" checked> Szyby</label>
        <label><input type="checkbox" id="g-daszek" checked> Daszek</label>
        <label><input type="checkbox" id="g-dszyba"> Szyba daszka</label>
      </div>
    </div>
    <div>
      <div class="etk">Okna</div>
      <button type="button" class="akcja" id="otworz" aria-pressed="false">Otwórz okna</button>
    </div>
    <div>
      <div class="etk">Roleta ZIP</div>
      <div class="zip" role="radiogroup" aria-label="Roleta ZIP">
        <label><input type="radio" name="zip" id="zip-brak" value="brak" checked> brak</label>
        <label><input type="radio" name="zip" id="zip-0" value="0"> w licu ramy</label>
        <label><input type="radio" name="zip" id="zip-10" value="10"> offset 10 mm</label>
        <label><input type="radio" name="zip" id="zip-20" value="20"> offset 20 mm</label>
      </div>
    </div>
    <div class="suwak" id="zip-s" hidden>
      <div class="gora"><label for="opu">Opuszczenie rolety</label><output id="opu-o" for="opu"></output></div>
      <input type="range" id="opu" min="0" max="100" step="1" value="100">
    </div>
    <div>
      <div class="etk">Moskitiera NEHER</div>
      <div class="zip" role="radiogroup" aria-label="Moskitiera NEHER" id="mosk-w">
        <label><input type="radio" name="mosk" value="brak" checked> brak</label>
      </div>
    </div>
    <div class="suwak">
      <div class="gora"><label for="cx">Cięcie pionowe</label><output id="cx-o" for="cx"></output></div>
      <input type="range" id="cx" min="0" max="1000" step="1" value="1000">
    </div>
    <div class="suwak">
      <div class="gora"><label for="cy">Cięcie poziome</label><output id="cy-o" for="cy"></output></div>
      <input type="range" id="cy" min="0" max="1000" step="1" value="1000">
    </div>
    <p>Obrót – przeciągnij, przesuw – prawy przycisk, zbliżenie – kółko.</p>
  </div>
</details>

    side: THREE.DoubleSide, depthWrite: false, flatShading: true, clippingPlanes: PL });
  else { mF[k] = new THREE.MeshStandardMaterial({ color: c, roughness: ch, metalness: met, flatShading: true, clippingPlanes: PL,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    mB[k] = new THREE.MeshBasicMaterial({ color: cut, side: THREE.BackSide, clippingPlanes: PL }); }
}
// okna dwukolorowe: od pokoju (za środkiem szyby) kolor wewnętrzny – wg położenia w bryle (skrzydło otwarte też dobrze)
const BK = D.bikolor, wewC = new THREE.Color(BK.wew);
for (const k of BK.mat) if (mF[k]) mF[k].onBeforeCompile = sh => {
  sh.uniforms.uZs = { value: BK.zs }; sh.uniforms.uWew = { value: wewC };
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying float vZo;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvZo = position.z;");
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying float vZo;\nuniform float uZs;\nuniform vec3 uWew;")
    .replace("vec4 diffuseColor = vec4( diffuse, opacity );", "vec4 diffuseColor = vec4( vZo < uZs ? uWew : diffuse, opacity );");
};
const mK = new THREE.LineBasicMaterial({ color: 0x2a2f35, transparent: true, opacity: 0.5, clippingPlanes: PL });
const cele = [], ZR = {};
const zr = (w, o) => ((ZR[w] = ZR[w] || {})[o] = ZR[w][o] || {});
for (const [nazwa, mat, gr, v0, vn, i0, ni, ruch] of D.m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(POS.subarray(v0 * 3, (v0 + vn) * 3), 3));
  g.setIndex(new THREE.BufferAttribute(IDX.subarray(i0, i0 + ni), 1)); g.computeBoundingSphere();
  let cel = grupa(gr);
  if (ruch && ruch.sk) cel = zawias(gr, ruch.sk);                                                                // skrzydło
  else if (ruch) { const z = zr(ruch.w, ruch.o); if (!z.obc) { z.obc = new THREE.Group(); cel.add(z.obc); } cel = z.obc; }   // obciążnik
  const m = new THREE.Mesh(g, mF[mat]); m.userData.nazwa = nazwa; cel.add(m); cele.push(m);
  if (mB[mat]) { const b = new THREE.Mesh(g, mB[mat]); b.userData.nazwa = nazwa; cel.add(b); cele.push(b);
    cel.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), mK)); }
  else m.renderOrder = 2;
}
// roleta ZIP: tkanina (z kasety do obciążnika) i obciążnik przesuwany suwakiem
const mT = new THREE.MeshStandardMaterial({ color: "#2b3034", transparent: true, opacity: 0.6, roughness: 0.9, metalness: 0,
  side: THREE.DoubleSide, depthWrite: false, clippingPlanes: PL });
for (const [w, okna] of Object.entries(D.zip)) for (const [o, d] of Object.entries(okna)) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mT); f.userData.nazwa = d.nazwa; f.renderOrder = 1;
  grupa("zip" + w).add(f); cele.push(f); Object.assign(zr(w, o), { fab: f, d });
}
const opu = document.getElementById("opu"), opuO = document.getElementById("opu-o");
const zipS = document.getElementById("zip-s");
function roleta() {
  const t = +opu.value / 100;
  for (const okna of Object.values(ZR)) for (const { obc, fab, d } of Object.values(okna)) {
    const v = d.vUp + t * (d.vLand - d.vUp);
    if (obc) obc.position.y = (d.vLand - v) / 1000;
    const yT = (d.y0 - d.vTop) / 1000, yB = (d.y0 - (v - 14)) / 1000;
    fab.scale.set(d.x1 - d.x0, Math.max(yT - yB, 0.001), 0.0008); fab.position.set((d.x0 + d.x1) / 2, (yT + yB) / 2, d.z);
  }
  opuO.value = t <= 0 ? "zwinięta" : t >= 1 ? "opuszczona" : `${Math.round(t * 100)} %`; brudne = true;
}
function wariant() {
  const w = document.querySelector('input[name="zip"]:checked').value;
  for (const k of Object.keys(D.zip)) grupa("zip" + k).visible = k === w;
  zipS.hidden = w === "brak"; brudne = true;
}
for (const i of document.querySelectorAll('input[name="zip"]')) i.addEventListener("change", () => { wariant(); moskitiera(); });
opu.addEventListener("input", roleta);

// klamki (rozeta + dźwignia; w dół – zamknięte, poziomo – do otwierania) i otwieranie jednym przyciskiem
const mKl = new THREE.MeshStandardMaterial({ color: "#d9dcdf", roughness: 0.35, metalness: 0.6, flatShading: true, clippingPlanes: PL });
const KL = [], mTraf = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });   // obszar kliknięcia klamki
for (const [s, d] of Object.entries(D.skrz)) {
  const w = zawias("okno", s), roz = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.076, 0.012), mKl);
  roz.position.set(d.kx, d.ky, d.kz - 0.006); roz.userData.nazwa = d.nazwa; w.add(roz); cele.push(roz);
  const os = new THREE.Group(); os.position.set(d.kx, d.ky, d.kz - 0.024); w.add(os);
  const szyjka = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.014, 0.024), mKl); szyjka.position.z = 0.012; os.add(szyjka);
  const dz = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.125, 0.016), mKl); dz.position.set(0, -0.055, 0); os.add(dz);
  const traf = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.06), mTraf); traf.position.set(d.kx, d.ky - 0.035, d.kz - 0.02); w.add(traf);
  for (const m of [roz, szyjka, dz, traf]) { m.userData.nazwa = d.nazwa + " – kliknij: otwórz / zamknij"; m.userData.okno = s; cele.push(m); }
  KL.push({ os, zn: d.zn, s });
}
const KAT = 88 * Math.PI / 180;
const OTW = {};                                                         // okno -> { t: 0..1, cel, an: animacja }
for (const s of Object.keys(D.skrz)) OTW[s] = { t: 0, cel: 0, an: null };
const gladko = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
function okno(s) {
  const t = OTW[s].t, kl = gladko(0, 0.22, t), sk = gladko(0.22, 1, t);
  for (const { o, s: s_ } of Object.values(SK)) if (s_ === s) o.rotation.y = D.skrz[s].zn * KAT * sk;
  for (const k of KL) if (k.s === s) k.os.rotation.z = -k.zn * (Math.PI / 2) * kl;   // dźwignia do poziomu – w stronę szyby
  brudne = true;
}
const btnO = document.getElementById("otworz");
function przycisk() { const ot = Object.values(OTW).some(st => st.cel); btnO.setAttribute("aria-pressed", String(ot)); btnO.textContent = ot ? "Zamknij okna" : "Otwórz okna"; }
function ustawOkno(s, cel) {
  const st = OTW[s]; st.cel = cel;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { st.t = cel; st.an = null; okno(s); } else st.an = { s: performance.now(), od: st.t };
  przycisk();
}
btnO.addEventListener("click", () => { const cel = Object.values(OTW).some(st => st.cel) ? 0 : 1; for (const s of Object.keys(OTW)) ustawOkno(s, cel); });

// moskitiery NEHER: model z doboru NEHER, na obu oknach tam, gdzie pasuje przy wybranym położeniu rolety
const moskW = document.getElementById("mosk-w");
for (const c of D.mosk.modele) {
  const l = document.createElement("label"), i = document.createElement("input");
  i.type = "radio"; i.name = "mosk"; i.value = c; l.append(i, " " + c); moskW.append(l);
}
function moskitiera() {
  const c = document.querySelector('input[name="mosk"]:checked').value, z = document.querySelector('input[name="zip"]:checked').value;
  for (const n of Object.keys(grupy)) if (n.startsWith("mosk|")) {
    const [, c_, s_, o_] = n.split("|"), o = z === "brak" ? (D.mosk.brak[c] || {})[s_] : z;
    grupy[n].visible = c_ === c && o_ === o;
  }
  brudne = true;
}
for (const i of document.querySelectorAll('input[name="mosk"]')) i.addEventListener("change", moskitiera);

const odswiez = () => { brudne = true; };
function kolory() {
  const cs = getComputedStyle(document.documentElement);
  scena.background = new THREE.Color(cs.getPropertyValue("--scene").trim() || "#e3e7eb");
  mK.color.set(cs.getPropertyValue("--edge").trim() || "#2a2f35"); odswiez();
}
kolory();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", kolory); } catch (e) {}
new MutationObserver(kolory).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// cięcia: pionowe od muru (z lewej, patrząc z balkonu) do filaru; poziome od dołu do góry
const cx = document.getElementById("cx"), cy = document.getElementById("cy");
const cxO = document.getElementById("cx-o"), cyO = document.getElementById("cy-o");
const xCut = () => D.xMin + (D.xMax - D.xMin) * cx.value / 1000, yCut = () => D.yMin + (D.yMax - D.yMin) * cy.value / 1000;
function gdzie(u) {
  if (u > 1025) return "przez mur"; if (u > 0) return "przez okno większe"; if (u > -69) return "przez wspólną płytę";
  if (u > -670) return "przez okno w skrzyni"; if (u > -739) return "przez płytę skrzyni"; return "przez filar";
}
function ciecia() {
  const offX = +cx.value >= 1000, offY = +cy.value >= 1000;
  pX.constant = offX ? 1e3 : xCut(); pY.constant = offY ? 1e3 : yCut();
  cxO.value = offX ? "wyłączone" : gdzie(-xCut() * 1000);
  cyO.value = offY ? "wyłączone" : `${Math.round((yCut() - D.yBal) * 1000)} mm nad balkonem`;
  odswiez();
}
cx.addEventListener("input", ciecia); cy.addEventListener("input", ciecia);
for (const g of ["budynek", "skrzynia", "szyby", "daszek", "dszyba"]) document.getElementById("g-" + g).addEventListener("change", e => { grupy[g].visible = e.target.checked; odswiez(); });

// widoki: kamera (metry), cel, cięcia (u w mm przez okno; wysokość nad balkonem w mm)
const naX = u => Math.round((-u / 1000 - D.xMin) / (D.xMax - D.xMin) * 1000), naY = h => Math.round((D.yBal + h / 1000 - D.yMin) / (D.yMax - D.yMin) * 1000);
const WIDOKI = {
  "zewnatrz": { p: [-2.0, -0.45, 6.5], t: [-0.12, -1.28, 0.0], cx: 1000, cy: 1000 },
  "pokoj": { p: [1.75, -0.7, -6.0], t: [-0.12, -1.3, 0.0], cx: 1000, cy: 1000 },
  "przekroj-duze": { p: [5.6, -0.8, 2.1], t: [-0.5, -1.3, 0.5], cx: naX(500), cy: 1000 },
  "przekroj-skrzynia": { p: [6.5, -0.8, 2.1], t: [0.4, -1.3, 0.45], cx: naX(-400), cy: 1000 },
  "rzut": { p: [-0.12, 2.6, 1.1], t: [-0.12, -1.3, 0.12], cx: 1000, cy: naY(1300) },
  "dol-duzego": { p: [0.15, -2.05, 0.95], t: [-0.5, -2.47, 0.02], cx: naX(500), cy: 1000 },
  "dol-skrzyni": { p: [1.05, -2.0, 0.95], t: [0.4, -2.4, 0.02], cx: naX(-400), cy: 1000 },
  "gora-duzego": { p: [0.15, 0.3, 1.0], t: [-0.5, -0.06, 0.03], cx: naX(500), cy: 1000 },
  "daszek": { p: [-3.4, 1.9, 4.4], t: [-0.1, -0.35, 0.35], cx: 1000, cy: 1000 }
};
let lot = null;
function ustaw(n, plynnie) {
  const w = WIDOKI[n] || WIDOKI.zewnatrz; cx.value = w.cx; cy.value = w.cy; ciecia();
  for (const b of document.querySelectorAll("#widoki button")) b.setAttribute("aria-pressed", String(b.dataset.w === n));
  const p1 = new THREE.Vector3(...w.p), t1 = new THREE.Vector3(...w.t);
  if (!plynnie || matchMedia("(prefers-reduced-motion: reduce)").matches) { kam.position.copy(p1); ster.target.copy(t1); ster.update(); odswiez(); return; }
  lot = { p0: kam.position.clone(), t0: ster.target.clone(), p1, t1, s: performance.now() };
}
for (const b of document.querySelectorAll("#widoki button")) b.addEventListener("click", () => {
  if (location.hash === "#" + b.dataset.w) ustaw(b.dataset.w, true); else location.hash = b.dataset.w; });
addEventListener("hashchange", () => ustaw(location.hash.slice(1), true));

// nazwa części pod kursorem / po kliknięciu (z pominięciem tego, co odcięte)
const ray = new THREE.Raycaster(), mysz = new THREE.Vector2(), nazwaT = document.getElementById("nazwa-t");
function trafienie(x, y) {
  const rc = r.domElement.getBoundingClientRect(); mysz.set((x - rc.left) / rc.width * 2 - 1, -(y - rc.top) / rc.height * 2 + 1);
  ray.setFromCamera(mysz, kam);
  const widac = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  for (const h of ray.intersectObjects(cele.filter(widac), false))
    if (pX.distanceToPoint(h.point) >= 0 && pY.distanceToPoint(h.point) >= 0) return h.object;
  return null;
}
let ruch = null, wcisk = null;
r.domElement.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { ruch = [e.clientX, e.clientY]; } });
r.domElement.addEventListener("pointerdown", e => { wcisk = [e.clientX, e.clientY]; });
r.domElement.addEventListener("pointerup", e => {
  ruch = [e.clientX, e.clientY];
  if (wcisk && Math.hypot(e.clientX - wcisk[0], e.clientY - wcisk[1]) < 6) {             // klik (bez obracania) w klamkę
    const o = trafienie(e.clientX, e.clientY), s = o && o.userData.okno;
    if (s) ustawOkno(s, OTW[s].cel ? 0 : 1);
  }
  wcisk = null;
});

const tab = document.getElementById("tab");
function rozmiar() {
  const w = host.clientWidth, h = host.clientHeight; r.setSize(w, h, false);
  const d = tab.open && w > 760 ? Math.round((tab.getBoundingClientRect().right + 8) / 2) : 0;   // obok panelu
  kam.aspect = (w + 2 * d) / h; if (d) kam.setViewOffset(w + 2 * d, h, 0, 0, w, h); else kam.clearViewOffset();
  kam.updateProjectionMatrix(); odswiez();
}
new ResizeObserver(rozmiar).observe(host); tab.addEventListener("toggle", rozmiar); rozmiar();
ster.addEventListener("change", odswiez);
// zbliżenie kółkiem / touchpadem (user 5.11: na touchpadzie ThinkPada za wolno): własne zamiast OrbitControls – krok zależy
// od wielkości ruchu (touchpad daje wiele małych zdarzeń, kółko myszy ok. 100 na ząbek; szczypanie – ctrlKey, małe wartości),
// w stronę punktu pod kursorem (na płaszczyźnie celu)
const _p = new THREE.Plane(), _r = new THREE.Raycaster(), _v = new THREE.Vector2(), _P = new THREE.Vector3(), _n = new THREE.Vector3();
host.addEventListener("wheel", e => {
  e.preventDefault(); e.stopPropagation();
  const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  const f = Math.exp(Math.max(-0.6, Math.min(0.6, d * (e.ctrlKey ? 0.012 : 0.0022))));
  const odl = kam.position.distanceTo(ster.target), k = Math.min(Math.max(odl * f, 0.04), 25) / odl;
  const rc = r.domElement.getBoundingClientRect(); _v.set((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1);
  _r.setFromCamera(_v, kam); kam.getWorldDirection(_n); _p.setFromNormalAndCoplanarPoint(_n, ster.target);
  if (!_r.ray.intersectPlane(_p, _P)) _P.copy(ster.target);
  kam.position.sub(_P).multiplyScalar(k).add(_P); ster.target.sub(_P).multiplyScalar(k).add(_P);
  lot = null; ster.update(); odswiez();
}, { capture: true, passive: false });
roleta(); wariant(); moskitiera();
ustaw(location.hash.slice(1) || "zewnatrz", false);
if (location.search.includes("otwarte")) { for (const s of Object.keys(OTW)) { OTW[s].t = OTW[s].cel = 1; okno(s); } przycisk(); }
{ const m = location.search.match(/mosk=([^&]+)/); if (m) { const i = document.querySelector(`input[name="mosk"][value="${decodeURIComponent(m[1])}"]`); if (i) { i.checked = true; moskitiera(); } } }
{ const m = location.search.match(/zip=([^&]+)/); if (m) { const i = document.getElementById("zip-" + m[1]); if (i) { i.checked = true; wariant(); moskitiera(); } } }

(function petla(t) {
  requestAnimationFrame(petla);
  if (lot) { const k = Math.min(1, (performance.now() - lot.s) / 700), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    kam.position.lerpVectors(lot.p0, lot.p1, e); ster.target.lerpVectors(lot.t0, lot.t1, e); if (k >= 1) lot = null; brudne = true; }
  for (const [s, st] of Object.entries(OTW)) if (st.an) {
    const k = Math.min(1, (performance.now() - st.an.s) / 1800); st.t = st.an.od + (st.cel - st.an.od) * k; okno(s); if (k >= 1) st.an = null; }
  if (ster.update()) brudne = true;
  if (ruch) { const o = trafienie(...ruch); nazwaT.textContent = o ? o.userData.nazwa : "najedź na element";
    r.domElement.style.cursor = o && o.userData.okno ? "pointer" : ""; ruch = null; }
  if (brudne) { r.render(scena, kam); brudne = false;
    if (!window.__okna3dGotowe) { window.__okna3dGotowe = true; document.getElementById("blad").hidden = true; } }
})();
if (matchMedia("(max-width: 600px)").matches) { tab.open = false; rozmiar(); }
</script>
